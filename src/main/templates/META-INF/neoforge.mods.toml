modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
authors="${mod_authors}"
description='''${mod_description}'''

# [[mixins]]
# config="${mod_id}.mixins.json"

# [[accessTransformers]]
# file="META-INF/accesstransformer.cfg"

# --- Required dependencies ------------------------------------------------

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Applied Energistics 2 - compiled against 19.2.20, pinned to the 19.2.x line
[[dependencies.${mod_id}]]
    modId="ae2"
    type="required"
    versionRange="${ae2_version_range}"
    ordering="AFTER"
    side="BOTH"

# Create
[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="${create_version_range}"
    ordering="AFTER"
    side="BOTH"

# Create: Crafted Beginning - the gases this addon is built around
[[dependencies.${mod_id}]]
    modId="createcraftedbeginning"
    type="required"
    versionRange="${ccb_version_range}"
    ordering="AFTER"
    side="BOTH"
