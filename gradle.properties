# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is deliberately OFF: NeoForge/ModDevGradle run tasks and
# datagen do not always behave with it, and it obscures errors during setup.
org.gradle.configuration-cache=false

# --- Network hardening (do not remove) -----------------------------------
# This network intermittently RSTs TLS handshakes to CDNs such as
# libraries.minecraft.net / services.gradle.org. The hosts themselves are
# reachable (curl and plain Java both get HTTP 200), so the cure is patience:
# retry more and wait longer instead of failing the build. Without these a
# first-time build dies with "SSL peer shut down incorrectly".
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.tentatives=10
systemProp.org.gradle.internal.repository.initial.backoff=2000

# Parchment (better parameter names / javadoc)
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
# Latest NeoForge versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.251
neo_version_range=[21.1.0,)
loader_version_range=[1,)

# Mod identity (fixed - do not change)
mod_id=appliedcraftedenergistics
mod_name=Applied Crafted Energistics
mod_license=LGPL-3.0-only
mod_version=0.2.2
mod_group_id=com.appliedcraftedenergistics
mod_authors=Applied Crafted Energistics Team
mod_description=An AE2 addon for Create: Crafted Beginning (ACE). Currently it makes CCB gases storable, transportable and craftable through an ME network, with gas cells, an ME Gas Interface and Gas P2P tunnels; the name is deliberately content-agnostic for future CCB systems such as optical power.

# Third-party mod versions + the ranges advertised to FML in neoforge.mods.toml
ae2_version=19.2.20
ae2_version_range=[19.2.20,20.0.0)
create_version=6.0.10-280
create_version_range=[6.0.10,6.1.0)
ccb_version=0.1.1
ccb_version_range=[0.1.1,0.2)
