distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# NOTE: services.gradle.org does not complete a TLS handshake from this machine,
# so the wrapper points straight at the official CDN host it would redirect to.
# If you are on a different network you may revert to:
#   https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
distributionUrl=https\://downloads.gradle.org/distributions/gradle-8.14.3-bin.zip
# 137 MB download on a slow link: the 10s default times out.
networkTimeout=180000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
